<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GS Calidad Técnica</title>
<meta name="description" content="Inspección de calidad técnica de actividades ESPT · Gestión Social">
<meta name="theme-color" content="#FF6600">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>try{var t=localStorage.getItem('gs-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
:root{
  --bg:#FEFEFF;--surface:#FEFEFF;--s2:#F2F4F6;--text:#1B1F23;--muted:#5B6670;--line:#DDE2E7;
  --p:#FF6600;--btn:#FF6600;--btnfg:#1B1F23;--sec:#C1C7CE;--ter:#79D1FF;
  --ok:#17703F;--okbg:#E3F5EA;--bad:#B3261E;--badbg:#FDE8E6;--badline:#F3C3BF;
  --shadow:0 8px 30px rgba(20,30,40,.12);--hdr-h:170px;
  --f-head:Manrope,"Segoe UI","Helvetica Neue",Arial,sans-serif;--f-body:"Open Sans","Segoe UI","Helvetica Neue",Arial,sans-serif;
}
:root[data-theme=dark]{
  --bg:#12161A;--surface:#1B2126;--s2:#242B31;--text:#ECEFF2;--muted:#9AA6B1;--line:#333C44;
  --ok:#6FD19A;--okbg:#16301F;--bad:#FF8A80;--badbg:#3A1E1C;--badline:#5A2A27;--shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{font-family:var(--f-body);background:var(--bg);color:var(--text);font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
@media(min-width:800px){body{background:linear-gradient(135deg,#EEF1F4,#E3E8ED)}:root[data-theme=dark] body{background:#0C0F12}.app{margin:20px auto;min-height:calc(100% - 40px);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}}
/* encabezado */
.top{position:relative;height:var(--hdr-h);flex:none;overflow:hidden;background:var(--bg)}
body[data-view=pend]{--hdr-h:170px}
body[data-view=ejec],body[data-view=env]{--hdr-h:118px}
body[data-view=form]{--hdr-h:66px}
.top .scene{position:absolute;inset:0;width:100%;height:100%;display:none}
body[data-view=pend] .top .scene.sup{display:block}
body[data-view=ejec] .top .scene.simple,body[data-view=env] .top .scene.simple{display:block}
:root[data-theme=dark] .top .scene{opacity:.82}
.bar{position:absolute;left:0;right:0;top:max(14px,env(safe-area-inset-top));padding:0 16px;display:flex;align-items:center;gap:11px}
body[data-view=form] .bar{top:12px}
.logo{width:42px;height:42px;border-radius:12px;background:var(--p);display:grid;place-items:center;flex:none;box-shadow:0 4px 10px rgba(255,102,0,.35)}
.ttl{font:800 17px/1.1 var(--f-head);color:#1B1F23}
.sub{position:absolute;left:16px;right:16px;bottom:5px;z-index:2;font:700 11.5px var(--f-head);color:#FEFEFF;text-shadow:0 1px 2px rgba(20,25,30,.55);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[data-theme=dark] .ttl{color:#1B1F23}
.sp{margin-left:auto;display:flex;gap:8px;align-items:center}
.chip-sup{background:#FEFEFF;color:#1B1F23;border:1px solid var(--line);border-radius:20px;padding:6px 11px;font:700 12px var(--f-head);display:flex;align-items:center;gap:6px;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ter)}
.iconbtn{width:36px;height:36px;border-radius:50%;background:#FEFEFF;color:#1B1F23;display:grid;place-items:center;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* contenido */
main{flex:1;padding:12px 14px 96px;display:flex;flex-direction:column;gap:10px}
.search{display:flex;align-items:center;gap:8px;height:44px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.search:focus-within{border-color:var(--p)}
.search input{flex:1;border:0;outline:0;background:none;min-width:0}
.sum{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:0 2px}
.sum b{color:var(--text)}
.sum button{color:var(--text);font-weight:700;text-decoration:underline;text-decoration-color:var(--p);text-decoration-thickness:2px;text-underline-offset:3px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 2px 8px rgba(30,40,50,.05)}
.item{display:flex;gap:10px;align-items:center;border-left:4px solid var(--p);text-align:left;width:100%}
.item .a{font:700 14.5px var(--f-head)}
.item .b{font-size:12px;color:var(--muted);margin-top:2px}
.item .go{margin-left:auto;color:var(--sec);font-size:22px;flex:none}
.empty{text-align:center;padding:34px 18px;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty b{color:var(--text);font:800 16px var(--f-head)}
.btn{min-height:46px;border-radius:13px;padding:0 18px;font:800 15px var(--f-head);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--btn);color:var(--btnfg);box-shadow:0 6px 14px rgba(255,102,0,.32)}
.btn.primary[disabled]{background:var(--sec);box-shadow:none;opacity:.7;cursor:not-allowed}
.btn.ghost{border:1.5px solid var(--line);background:var(--surface)}
.btn.danger{border:1.5px solid var(--badline);color:var(--bad);background:var(--surface)}
.btn.block{width:100%}
.link{font:700 12.5px var(--f-head);text-decoration:underline;text-decoration-color:var(--p);text-decoration-thickness:2px;text-underline-offset:3px;padding:4px 0;align-self:flex-start}
.badge{font:800 10.5px var(--f-head);border-radius:20px;padding:3px 9px;letter-spacing:.3px;white-space:nowrap;display:inline-block}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:rgba(255,102,0,.16)}
.h2{font:800 12px var(--f-head);color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin:4px 2px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin-top:10px}
.grid div{font-size:11.5px;color:var(--muted);min-width:0}.grid b{display:block;font-weight:600;font-size:13px;color:var(--text);overflow-wrap:anywhere}
.grid a{color:var(--text);text-decoration-color:var(--p);text-underline-offset:3px}
.osobs{margin-top:12px;border-left:4px solid var(--ter);background:var(--s2);border-radius:10px;padding:9px 11px}
.osl{font:800 11px var(--f-head);text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:4px}
.osobs p{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;font:700 12.5px var(--f-head);margin-top:10px}
details p{font-size:12px;color:var(--muted);margin-top:6px;white-space:pre-wrap;overflow-wrap:anywhere}
/* formulario */
.fhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.back{font:800 14px var(--f-head);display:flex;align-items:center;gap:4px;padding:6px 2px}
.comp .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.comp h3{font:800 15px var(--f-head)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:12.5px;background:var(--s2);border:1px solid var(--line);border-radius:9px;padding:4px 9px}
.chip.bad{background:var(--badbg);border-color:var(--badline);color:var(--bad)}
.opts{margin-top:8px;display:flex;flex-direction:column;gap:5px}
.opt{display:flex;gap:10px;align-items:center;font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:var(--surface);text-align:left;width:100%}
.opt .box{width:18px;height:18px;border-radius:5px;border:2px solid var(--sec);flex:none;position:relative}
.opt.dis{opacity:.45}
.chip.empty-chip{background:rgba(255,102,0,.12);border-color:var(--p)}
.opt.on{border-color:var(--p);background:rgba(255,102,0,.09)}
.opt.on .box{background:var(--p);border-color:var(--p)}
.opt.on .box:after{content:"";position:absolute;left:4.5px;top:.5px;width:5px;height:9px;border:solid #1B1F23;border-width:0 2.4px 2.4px 0;transform:rotate(45deg)}
.photos{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
.th{width:54px;height:54px;border-radius:10px;position:relative;overflow:hidden;background:var(--s2);border:1px solid var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th .x{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(27,31,35,.78);color:#fff;font-size:13px;line-height:20px;text-align:center}
.pbtn{font:700 12px var(--f-head);border:1.5px dashed var(--sec);border-radius:10px;height:54px;padding:0 12px;display:flex;align-items:center;gap:6px;color:var(--muted)}
textarea.obs{width:100%;min-height:84px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);resize:vertical;margin-top:8px;outline:0}
textarea.obs:focus,.sel:focus{border-color:var(--p)}
.sel{width:100%;height:46px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface);outline:0}
.savebar{position:sticky;bottom:64px;padding:10px 0 4px;background:linear-gradient(180deg,rgba(254,254,255,0),var(--bg) 40%);display:flex;flex-direction:column;gap:8px;z-index:3}
:root[data-theme=dark] .savebar{background:linear-gradient(180deg,rgba(18,22,26,0),var(--bg) 40%)}
body[data-view=form] .savebar{bottom:0}
.row{display:flex;align-items:center;gap:11px}
.cb{width:24px;height:24px;border-radius:7px;border:2px solid var(--sec);flex:none;position:relative}
.cb.on{background:var(--p);border-color:var(--p)}
.cb.on:after{content:"";position:absolute;left:6.5px;top:1.5px;width:6px;height:11px;border:solid #1B1F23;border-width:0 2.6px 2.6px 0;transform:rotate(45deg)}
.fname{font:800 15px var(--f-head);overflow-wrap:anywhere;margin-top:3px}
.credit{text-align:center;font-size:11px;color:var(--muted);padding:14px 0 2px}
/* barra inferior */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:760px;margin:0 auto;height:calc(64px + env(safe-area-inset-bottom));padding:6px 8px env(safe-area-inset-bottom);background:var(--surface);border-top:1px solid var(--line);display:flex}
@media(min-width:800px){.tabs{bottom:20px;border-radius:0 0 22px 22px}}
body[data-view=form] .tabs{display:none}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 11px var(--f-head);color:var(--muted);position:relative}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--text)}
.tab.on:before{content:"";position:absolute;top:-6px;width:32px;height:3px;border-radius:3px;background:var(--p)}
.tab .n{position:absolute;top:0;left:calc(50% + 8px);background:var(--p);color:#1B1F23;border-radius:10px;font:800 10px var(--f-head);padding:1px 6px;min-width:18px;text-align:center}
/* diálogo y aviso */
dialog{border:0;border-radius:18px;padding:0;max-width:min(92vw,420px);width:100%;background:var(--surface);color:var(--text);box-shadow:var(--shadow);margin:auto}
dialog::backdrop{background:rgba(20,26,32,.55)}
.dlgbox{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlgbox h3{font:800 17px var(--f-head)}
.dlgbox p{color:var(--muted);font-size:14px}
.dlgbtns{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:4px}
.menu{display:flex;flex-direction:column;gap:8px}
.menu .btn{justify-content:flex-start;width:100%;font-size:14px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1B1F23;color:#FEFEFF;border-radius:12px;padding:11px 16px;font-size:13.5px;z-index:20;max-width:88vw;box-shadow:var(--shadow);text-align:center}
.muted{color:var(--muted)}
#lock{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,rgba(121,209,255,.55),rgba(121,209,255,.18) 55%,transparent),var(--bg)}
#lock.show{display:flex}
.lockbox{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px;text-align:center;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:20px;padding:26px 20px 18px;box-shadow:var(--shadow)}
.lockbox .mark{width:68px;height:68px;border-radius:18px;background:var(--p);display:grid;place-items:center;margin:0 auto;box-shadow:0 6px 16px rgba(255,102,0,.35)}
.lockbox h1{font:800 24px var(--f-head)}
.lockbox .err{color:var(--bad);font-weight:700;min-height:20px;font-size:14px}
.lockbox input{width:100%;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;background:var(--surface);outline:0;text-align:center}
.lockbox input:focus{border-color:var(--p)}
.lockbox .credit{padding:4px 0 0}
</style>
</head>

  return e;
}

/* ---------- CSV / JSON ---------- */
function parseCSV(t){
  if(t.charCodeAt(0)===0xFEFF)t=t.slice(1);
  const first=t.split(/\r?\n/,1)[0];const d=first.split(';').length>first.split(',').length?';':',';
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===d){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows;
}
function filasDe(text,name){
  const tt=text.trim();
  if(/\.json$/i.test(name)||tt[0]==='['||tt[0]==='{'){
    const j=JSON.parse(tt);
    return Array.isArray(j)?j:(j.value||j.items||j.pendientes||j.inspecciones||j.data||[]);
  }
  const rows=parseCSV(text).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length)return[];
  const head=rows[0];
  return rows.slice(1).map(r=>{const o={};head.forEach((k,i)=>o[k]=r[i]);return o;});
}
async function leerTexto(file){
  const buf=await file.arrayBuffer();let t=new TextDecoder('utf-8').decode(buf);
  if(t.includes('�'))t=new TextDecoder('windows-1252').decode(buf);
  return t;
}
const val=v=>{if(v==null)return'';if(typeof v==='object')return String(v.Value??v.value??v.Title??'');return String(v).trim();};
const PMAP={ordendeservicio:'orden',title:'orden',fechaejecucion:'fecha_ejec',medidorinstalado:'medidor',marca:'marca',cuadrilla:'cuadrilla',resultadoos:'resultado_os',observacionesos:'obs_os',supervisor:'supervisor',identificacion:'identificacion',nombreusuario:'usuario',celular:'celular',direccionpredio:'direccion',localidad:'localidad',sectorbarrio:'barrio',latitudy:'lat',longitudx:'lng',fechadeactualizacion:'fecha_act'};
function normPend(o){
  const p={};
  for(const[k,v]of Object.entries(o)){const m=PMAP[n(k)];if(m&&!p[m])p[m]=val(v);}
  if(p.orden)p.orden=p.orden.replace(/\.0+$/,'');
  for(const k of['lat','lng'])if(p[k])p[k]=p[k].replace(',','.');
  return p;
}
async function cargarPendientes(file){
  try{
    const rows=filasDe(await leerTexto(file),file.name);
    const seen=new Set(),ok=[];let sin=0;
    for(const r of rows){const p=normPend(r);if(!/^\d{5,}$/.test(p.orden||'')){sin++;continue;}if(seen.has(p.orden))continue;seen.add(p.orden);ok.push(p);}
    if(!ok.length){toast('No encontré órdenes en ese archivo. Revisa que tenga la columna Orden_de_Servicio.');return;}
    await dbClear('pend');for(const p of ok)await dbPut('pend',p);
    S.pend=ok;S.pendFecha=new Date().toISOString();await dbPut('meta',S.pendFecha,'pendFecha');
    const ya=ok.filter(p=>regDe(p.orden)).length;
    toast(`Cargadas ${ok.length} ${ok.length===1?'orden':'órdenes'}`+(ya?` · ${ya} ya inspeccionadas por ti`:'')+(sin?` · ${sin} ${sin===1?'fila':'filas'} sin orden`:''));
    go('pend');
  }catch(e){console.error(e);toast('No pude leer ese archivo de pendientes.');}
}
async function cargarCatalogo(file){
  try{
    const rows=filasDe(await leerTexto(file),file.name);
    const list=[];
    for(const o of rows){
      const g={};for(const[k,v]of Object.entries(o)){g[n(k)]=v;}
      const hall=val(g.hallazgo??g.hallazgonoconformidad??Object.entries(g).find(([k])=>k.startsWith('hallazgo'))?.[1]);
      if(!hall)continue;
      list.push({cod:val(g.codigo||g.cdigo||g.id||g.title),comp:val(g.componente),hall,estado:val(g.estado),activo:val(g.activo)});
    }
    if(list.length<5||list.some(x=>!x.cod)){toast('Ese catálogo no tiene el formato esperado (CÓDIGO, COMPONENTE, HALLAZGO, ESTADO, ACTIVO).');return;}
    setCatalogo(list);await dbPut('meta',list,'catalogo');
    toast(`Catálogo actualizado · ${list.filter(i=>n(i.activo)==='si').length} hallazgos activos`);render();
  }catch(e){console.error(e);toast('No pude leer ese catálogo.');}
}
function elegirArchivo(accept,cb){

/* ---------- ZIP (sin compresión) ---------- */
const CRCT=(()=>{const t=new Uint32Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[i]=c>>>0;}return t;})();
const crc32=u=>{let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;};
function makeZip(files){
  const enc=new TextEncoder(),chunks=[],cd=[];let off=0;const d=new Date();
  const time=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const f of files){
    const name=enc.encode(f.name),crc=crc32(f.data),len=f.data.length;
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint16(6,0x0800,true);lh.setUint16(8,0,true);lh.setUint16(10,time,true);lh.setUint16(12,date,true);
    lh.setUint32(14,crc,true);lh.setUint32(18,len,true);lh.setUint32(22,len,true);lh.setUint16(26,name.length,true);lh.setUint16(28,0,true);
    chunks.push(lh.buffer,name,f.data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);ch.setUint16(12,time,true);ch.setUint16(14,date,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,len,true);ch.setUint32(24,len,true);ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    cd.push(ch.buffer,name);
    off+=30+name.length+len;
  }
  const cdSize=cd.reduce((a,b)=>a+(b.byteLength!==undefined?b.byteLength:b.length),0);
  const end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);end.setUint32(12,cdSize,true);end.setUint32(16,off,true);
  return new Blob([...chunks,...cd,end.buffer],{type:'application/zip'});
}

/* ---------- registro y reglas de duplicados ---------- */
const idDe=(orden,sup)=>`${orden}_${slug(sup)}`;
const regDe=orden=>S.ejec.find(e=>e.orden===orden&&e.supervisor===S.sup);

function pendVisibles(){

  return{lista:base,ocultasReg:S.pend.length-sinReg.length,deOtros:sinReg.length-mias.length,hayAsig};
}

async function offlineListo(){

    ...(!instalada()?[dpInstalar?act('Instalar app en el celular',async()=>{dpInstalar.prompt();await dpInstalar.userChoice.catch(()=>{});dpInstalar=null;}):h('p',{class:'muted',style:'font-size:12.5px'},'Para instalarla: abre esta dirección en Chrome, toca ⋮ y elige «Instalar app».')]:[]),

async function reducir(file){
  const MAX=1400;let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'});}
  catch(e){bmp=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file);});}
  const w=bmp.width||bmp.naturalWidth,hh=bmp.height||bmp.naturalHeight,k=Math.min(1,MAX/Math.max(w,hh));
  const cv=document.createElement('canvas');cv.width=Math.round(w*k);cv.height=Math.round(hh*k);
  cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
  return new Promise(res=>cv.toBlob(res,'image/jpeg',.72));
}

    const json={esquema:'GS_Calidad_Tecnica_ESPT_v1',app_version:VERSION,generado:new Date().toISOString(),supervisor:S.sup,total:items.length,inspecciones:items};
    files.unshift({name:'inspecciones.json',data:new TextEncoder().encode(JSON.stringify(json,null,2))});
    const blob=makeZip(files),nombre=`${slug(S.sup)}_${hoy()}.zip`;
    const ahora=new Date().toISOString();
    for(const r of recs){r.estado='exportada';r.exportado=ahora;await dbPut('ejec',r);}
    render();
    const file=new File([blob],nombre,{type:'application/zip'});
    const puedeCompartir=navigator.canShare&&navigator.canShare({files:[file]});
    const url=URL.createObjectURL(blob);
    const descarga=()=>{const a=h('a',{href:url,download:nombre});document.body.append(a);a.click();a.remove();};
    const btns=[{id:'ok',text:'Cerrar'}];
    const content=h('div',{style:'display:flex;flex-direction:column;gap:10px'},
      h('p',null,`${items.length} ${items.length===1?'inspección':'inspecciones'} · ${files.length-1} fotos`),h('div',{class:'fname'},nombre),
      h('button',{class:'btn primary block',onclick:descarga},'Descargar zip'),
      puedeCompartir?h('button',{class:'btn ghost block',onclick:()=>navigator.share({files:[file],title:nombre}).catch(()=>{})},'Compartir (WhatsApp, correo…)'):null,
      h('p',{style:'font-size:12.5px'},'Sube el zip a la carpeta Entrada_Inspecciones de SharePoint.'));
    await modal({title:'Zip listo',content,buttons:btns});
    setTimeout(()=>URL.revokeObjectURL(url),60000);
  }catch(e){console.error(e);toast('No pude generar el zip. Intenta con menos inspecciones.');}
}

/* ---------- bloqueo: huella primero, clave de respaldo ---------- */
const LK='gsq_lock',MAXFAIL=5;
const lrd=()=>{try{return JSON.parse(localStorage.getItem(LK)||'null');}catch(e){return null;}};
const lwr=o=>{try{localStorage.setItem(LK,JSON.stringify(o));}catch(e){}};
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function lhash(clave,salt,iter){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveBits']);return b64(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:unb64(salt),iterations:iter},k,256));}
const FING='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FEFEFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 11v3.5c0 2-.5 3.5-1.5 5"/><path d="M8.5 14c0 2.5-.5 4-1.5 5.5"/><path d="M15.5 12.5c0 3.5-.7 6-2 8"/><path d="M5.5 10.5a6.5 6.5 0 0 1 12.7-1.8"/><path d="M8.5 11a3.5 3.5 0 0 1 7 0"/><path d="M19 13c0 3-.4 5-1.2 7"/></svg>';
const LOCKI='<svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FEFEFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>';
const LOGOK='<svg width="40" height="40" viewBox="0 0 26 26" fill="none"><circle cx="13" cy="13" r="10" stroke="#FEFEFF" stroke-width="2.4"/><path d="M8.2 13.4l3.3 3.3 6.4-6.8" stroke="#FEFEFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const L={unlocked:false,hiddenAt:0,idleT:null};
L.state=()=>{const s=lrd();return{configured:!!(s&&s.hash),skipped:!!(s&&s.skipped),auto:s&&s.auto!=null?s.auto:5,bio:!!(s&&s.bio)};};
L.bioSupported=async()=>{try{return !!(window.PublicKeyCredential&&PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable());}catch(e){return false;}};
async function lsetClave(clave){const salt=b64(crypto.getRandomValues(new Uint8Array(16))),iter=150000,s=lrd()||{};lwr({...s,skipped:false,salt,iter,hash:await lhash(clave,salt,iter),auto:s.auto!=null?s.auto:5,fails:0,until:0});}
async function lcheck(clave){const s=lrd();if(!s||!s.hash)return true;return(await lhash(clave,s.salt,s.iter))===s.hash;}
L.enableBio=async()=>{try{const cred=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:'GS Calidad Técnica'},user:{id:crypto.getRandomValues(new Uint8Array(16)),name:'supervisor',displayName:'Supervisor'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000}});const s=lrd()||{};lwr({...s,bio:b64(cred.rawId)});return true;}catch(e){return false;}};
L.disableBio=()=>{const s=lrd()||{};delete s.bio;lwr(s);};
async function bioUnlock(){const s=lrd();if(!s||!s.bio)return false;try{await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),allowCredentials:[{type:'public-key',id:unb64(s.bio)}],userVerification:'required',timeout:60000}});return true;}catch(e){return false;}}
function lbox(...kids){const el=$('#lock');el.replaceChildren(h('div',{class:'lockbox'},...kids,h('div',{class:'credit'},'Desarrollado por Heidi Díaz')));el.classList.add('show');return el;}
function lhide(){const el=$('#lock');el.classList.remove('show');el.replaceChildren();L.unlocked=true;armIdle();}
function showSetup(resolve){
  const a=h('input',{type:'password',placeholder:'Clave nueva',autocomplete:'new-password'}),b=h('input',{type:'password',placeholder:'Repite la clave',autocomplete:'new-password'}),er=h('div',{class:'err'});
  lbox(h('div',{class:'mark',html:LOCKI}),h('h1',null,'Protege la app'),h('p',{class:'muted'},'Crea una clave de al menos 6 caracteres. Después puedes activar la huella.'),a,b,er,
    h('button',{class:'btn primary block',onclick:async()=>{
      if(a.value.length<6)return er.textContent='La clave debe tener al menos 6 caracteres.';
      if(a.value!==b.value)return er.textContent='Las claves no coinciden.';
      await lsetClave(a.value);L.unlocked=true;
      if(await L.bioSupported()){
        lbox(h('div',{class:'mark',html:FING}),h('h1',null,'¿Usar tu huella?'),h('p',{class:'muted'},'Abrirás la app con la huella o el desbloqueo del teléfono. La clave queda de respaldo.'),
          h('button',{class:'btn primary block',onclick:async()=>{const ok=await L.enableBio();toast(ok?'Huella activada':'No se pudo activar la huella en este dispositivo');lhide();resolve();}},'Activar huella'),
          h('button',{class:'btn ghost block',onclick:()=>{lhide();resolve();}},'Más tarde'));
      }else{lhide();resolve();}
    }},'Crear clave'),
    h('button',{class:'btn ghost block',onclick:()=>{if(!L.state().configured)lwr({skipped:true});lhide();resolve();}},'Ahora no'));
  setTimeout(()=>a.focus(),100);
}
function showUnlock(resolve){
  const s=lrd(),hasBio=!!(s&&s.bio);
  const p=h('input',{type:'password',placeholder:'Clave',autocomplete:'current-password'}),er=h('div',{class:'err'});
  const tick=()=>{const u=((lrd()||{}).until||0)-Date.now();if(u>0){er.textContent=`Demasiados intentos. Espera ${Math.ceil(u/1000)} s.`;setTimeout(tick,500);}else if(er.textContent.startsWith('Demasiados'))er.textContent='';};
  const ok=()=>{const c=lrd()||{};lwr({...c,fails:0,until:0});lhide();resolve();};
  const bio=async()=>{if(await bioUnlock())ok();};
  const go=async()=>{const cur=lrd()||{};if((cur.until||0)>Date.now())return tick();
    if(await lcheck(p.value))ok();
    else{const f=(cur.fails||0)+1,wait=f>=MAXFAIL?Math.min(300,15*2**(f-MAXFAIL))*1000:0;lwr({...cur,fails:f,until:wait?Date.now()+wait:0});er.textContent=wait?'':'Clave incorrecta.';p.value='';tick();}};
  p.onkeydown=e=>{if(e.key==='Enter')go();};
  lbox(h('div',{class:'mark',html:hasBio?FING:LOGOK}),h('h1',null,'GS Calidad Técnica'),
    hasBio?h('button',{class:'btn primary block',onclick:bio},'Usar huella'):null,
    h('p',{class:'muted'},hasBio?'O ingresa tu clave':'Ingresa tu clave'),p,er,
    h('button',{class:hasBio?'btn ghost block':'btn primary block',onclick:go},'Entrar'));
  tick();
  if(hasBio)setTimeout(bio,250);else setTimeout(()=>p.focus(),100);
}
L.init=()=>new Promise(resolve=>{const st=L.state();if(!st.configured&&st.skipped){L.unlocked=true;return resolve();}if(!st.configured)return showSetup(resolve);showUnlock(resolve);});
L.lockNow=()=>{if(!L.state().configured)return toast('Aún no tienes clave. Créala en el menú.');L.unlocked=false;clearTimeout(L.idleT);showUnlock(()=>{});};
function armIdle(){clearTimeout(L.idleT);const st=L.state();if(!st.configured||!st.auto)return;L.idleT=setTimeout(()=>{if(L.unlocked&&!$('#dlg').open&&S.view!=='form')L.lockNow();else armIdle();},st.auto*60000);}
['pointerdown','keydown','scroll'].forEach(ev=>document.addEventListener(ev,()=>{if(L.unlocked)armIdle();},{passive:true}));
document.addEventListener('visibilitychange',()=>{const st=L.state();if(!st.configured)return;if(document.hidden)L.hiddenAt=Date.now();else if(L.unlocked&&st.auto&&Date.now()-L.hiddenAt>st.auto*60000)L.lockNow();});

/* ---------- arranque ---------- */
async function init(){
  await L.init();
  await openDB();
  const cat=await dbGet('meta','catalogo');setCatalogo(cat&&cat.length?cat:catBase());
  S.sup=(await dbGet('meta','supervisor'))||null;
  S.pendFecha=(await dbGet('meta','pendFecha'))||null;
  S.pend=await dbAll('pend');S.ejec=await dbAll('ejec');
  render();
  $('#chipSup').onclick=()=>elegirSup(false);$('#btnMenu').onclick=menu;
  if(!S.sup)elegirSup(true);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
  if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
}
init().catch(e=>{console.error(e);document.body.prepend(h('p',{style:'padding:20px'},'No se pudo iniciar el almacenamiento local de este navegador.'));});
})();
</script>
